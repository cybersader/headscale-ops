name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - name: Check formatting and release script syntax
        run: |
          test -z "$(gofmt -l ./*.go)"
          bash -n scripts/publish-release.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build static binary
        run: >-
          CGO_ENABLED=0 go build -trimpath
          -ldflags="-s -w -X main.buildVersion=ci -X main.buildRevision=${GITHUB_SHA}"
          -o headscale-ops .
      - name: Smoke test
        run: |
          ./headscale-ops version
          ./headscale-ops --help >/dev/null
